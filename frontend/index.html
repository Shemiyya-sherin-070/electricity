<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>Electricity Bill Calculator</h2>
                    <p class="mb-0">
                        Calculate your electricity bill
                    </p>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="customerName" class="form-label">
                            Customer Name
                        </label>
                        <input
                            type="text"
                            id="customerName"
                            class="form-control"
                            placeholder="Enter customer name"
                        >
                    </div>
                    <div class="mb-3">
                        <label for="units"
                               class="form-label">
                            Electricity Units Consumed
                        </label>
                        <input
                            type="number"
                            id="units"
                            class="form-control"
                            placeholder="Enter units consumed"
                            min="0"
                            step="0.01"
                        >
                    </div>
                    
                    <button type="button" id="calculateBtn" class="btn btn-primary w-100">Calculate Bill</button>
                    <div id="loading" class="text-center mt-3 d-none"> Calculating bill...</div>
                    <!-- Error -->
                    <div
                        id="errorMessage"
                        class="alert alert-danger mt-3 d-none"
                    ></div>
                    <!-- Bill Result -->
                    <div id="billResult" class="mt-4 d-none">
                        <h4 class="mb-3">Bill Details</h4>
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <tbody>
                                    <tr>
                                        <th>Customer Name</th>
                                        <td id="resultCustomer"></td>
                                    </tr>
                                    <tr>
                                        <th>Units Consumed</th>
                                        <td id="resultUnits"></td>
                                    </tr>
                                    <tr>
                                        <th>Energy Charge</th>
                                        <td id="energyCharge"></td>
                                    </tr>
                                    <tr>
                                        <th>Fixed Charge</th>
                                        <td id="fixedCharge"></td>
                                    </tr>
                                    <tr>
                                        <th>Subtotal</th>
                                        <td id="subtotal"></td>
                                    </tr>
                                    <tr>
                                        <th>Tax (5%)</th>
                                        <td id="tax"></td>
                                    </tr>
                                    <tr class="table-success">
                                        <th>Total Bill</th>
                                        <th id="totalBill"></th>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Usage Message -->
                        <div
                            id="usageMessage"
                            class="alert text-center"
                        ></div>
                        <!-- Print -->
                        <button type="button" onclick="window.print()" class="btn btn-secondary w-100">
                            Print Bill
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
